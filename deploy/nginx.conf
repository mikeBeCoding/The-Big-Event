# nginx reverse proxy for The Big Event.
# Copy to /etc/nginx/sites-available/bigevent, then:
#   sudo ln -s /etc/nginx/sites-available/bigevent /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d mikebecoding.com -d www.mikebecoding.com   # adds HTTPS
#
# The Node server (port 4000) serves both the built frontend and the /api
# routes, so nginx only needs to proxy everything through and terminate TLS.

server {
    listen 80;
    server_name mikebecoding.com www.mikebecoding.com;

    # Allow larger request bodies (conversation transcripts can grow).
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # LLM evaluation calls can be slow
    }
}
